services:
  - type: web
    name: pmm-dms-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    disk:
      name: pmm-dms-runtime
      mountPath: /opt/render/project/src/runtime
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /opt/render/project/src/runtime/db/workshop_dms.sqlite
      - key: UPLOAD_DIR
        value: /opt/render/project/src/runtime/uploads
      - key: PDF_OUTPUT_DIR
        value: /opt/render/project/src/runtime/generated_pdfs
      - key: AUTO_SEED
        value: "true"
      - key: USE_GEMINI_AI
        value: "true"
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: google/gemini-2.5-flash
      - key: FRONTEND_APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAIL_SERVICE_URL
        sync: false
      - key: MAIL_SERVICE_SECRET
        sync: false
      - key: FEEDBACK_FORM_URL
        sync: false
